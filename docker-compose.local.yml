services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatgpt2api:local
    container_name: chatgpt2api-local
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./data:/app/data
    environment:
      # 复制 .env.example 为 .env 后，可按需覆盖这些运行时配置。
      CHATGPT2API_ADMIN_PASSWORD: ${CHATGPT2API_ADMIN_PASSWORD:-}
      CHATGPT2API_SESSION_SECRET: ${CHATGPT2API_SESSION_SECRET:-}
      CHATGPT2API_UPSTREAM_API_URL: ${CHATGPT2API_UPSTREAM_API_URL:-}
      CHATGPT2API_UPSTREAM_API_KEY: ${CHATGPT2API_UPSTREAM_API_KEY:-}
      CHATGPT2API_PROXY: ${CHATGPT2API_PROXY:-}
      CHATGPT2API_BASE_URL: ${CHATGPT2API_BASE_URL:-}
      CHATGPT2API_IMAGE_RETENTION_DAYS: ${CHATGPT2API_IMAGE_RETENTION_DAYS:-}
      CHATGPT2API_MAX_IMAGES_PER_REQUEST: ${CHATGPT2API_MAX_IMAGES_PER_REQUEST:-}
